# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name thirunavukkarasuthangaraj.fun www.thirunavukkarasuthangaraj.fun;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name thirunavukkarasuthangaraj.fun www.thirunavukkarasuthangaraj.fun;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/thirunavukkarasuthangaraj.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thirunavukkarasuthangaraj.fun/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
