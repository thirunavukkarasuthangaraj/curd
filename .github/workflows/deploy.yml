name: Deploy Backend and Frontend Using Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          cd /home/ec2-user/curd
          git pull origin main

          # Step 0: Create swap memory (safe even if exists)
          sudo fallocate -l 2G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          sudo swapon --show

          # Check memory and disk
          df -h
          free -h

          # Step 1: Build Backend
          cd springboot-backend
          ./mvnw clean package -DskipTests || mvn clean package -DskipTests
          cp target/*.jar backend.jar
          cd ..

          # Step 2: Build Frontend (outside Docker)
          cd angular-frontend
          npm install --legacy-peer-deps || { echo "❌ npm install failed"; exit 1; }
          npm run build -- --configuration=production --no-progress --build-optimizer || { echo "❌ Angular build failed"; exit 1; }
          cd ..

          # Step 3: Docker Compose up
          docker-compose down
          docker-compose build backend
          docker-compose up -d
