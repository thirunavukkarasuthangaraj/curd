name: Deploy Backend, Frontend, Postgres via Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SSH into EC2 and Deploy
      uses: appleboy/ssh-action@v0.1.6   # ✅ use a specific stable version
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          echo "👉 Connected to EC2"

          # Move into project directory
          cd /home/ec2-user/curd

          # 🛜 Create SWAP MEMORY if not exists (safe mode)
          sudo fallocate -l 2G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          sudo swapon --show || true

          echo "👉 Swap memory created or already exists."

          # 📦 Pull latest code
          git pull origin main

          # ⚙️ Build backend (Spring Boot)
          cd springboot-backend
          ./mvnw clean package -DskipTests || mvn clean package -DskipTests

          # 🐳 Docker Compose
          cd ..
          docker-compose down
          docker-compose build
          docker-compose up -d

          echo "✅ Deployment completed successfully!"
