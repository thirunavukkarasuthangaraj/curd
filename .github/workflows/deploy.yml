name: Deploy Backend and Frontend Using Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        port: 22
        command_timeout: 30m
        script: |
          cd /home/ec2-user/curd
          git pull origin main

          # Optional: Add swap memory (useful for builds)
          sudo fallocate -l 2G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          sudo swapon --show

          # Build Backend JAR
          cd springboot-backend
          ./mvnw clean package -DskipTests || mvn clean package -DskipTests
          cp target/springboot-backend-0.0.1.jar backend.jar
          cd ..

          # Clean old unused Docker images (optional but helpful)
          docker image prune -af || true

          # Rebuild BOTH backend and frontend Docker images
          docker-compose build backend frontend

          # Restart all containers
          docker-compose down
          docker-compose up -d