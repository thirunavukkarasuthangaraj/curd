name: Deploy Spring Boot Server

on:
  push:
    branches:
      - main
    paths:
      - "springboot-backend/**"

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set Up JDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '8'


    - name: Build Spring Boot JAR
      run: |
        cd springboot-backend
        mvn clean package -DskipTests

    - name: Upload JAR to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        aws s3 cp springboot-backend/target/*.jar s3://${{ secrets.S3_SERVER_BUCKET }}/app.jar

    - name: SSH to EC2 and Deploy Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          aws s3 cp s3://${{ secrets.S3_SERVER_BUCKET }}/app.jar /home/ec2-user/app.jar
          sudo kill $(lsof -t -i:8080) || true
          nohup java -jar /home/ec2-user/app.jar > /home/ec2-user/app.log 2>&1 &
