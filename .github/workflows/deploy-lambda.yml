name: Deploy Spring Boot Lambda to AWS

on:
  push:
    branches:
      - main  # Change this if you use another branch
    paths:
      - 'springboot-backend-lampda/**'  # Triggers only if files inside lambda/ change
  workflow_dispatch:  # Allows manual execution from GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build the JAR
         
        run: |
          ls -R
          cd lambda
          mvn clean package -DskipTests

      - name: Verify JAR File
        run: |
          if [ ! -f "lambda/target/springboot-lambda-0.0.1-SNAPSHOT.jar" ]; then
            echo "Error: JAR file not found!"
            exit 1
          fi
          echo "JAR file exists. Proceeding to upload."

      - name: Upload JAR to S3
        run: |
          aws s3 sync lambda/target/ s3://${{ secrets.S3_BUCKET_NAME }}/ --exclude "*" --include "springboot-lambda-0.0.1-SNAPSHOT.jar"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy JAR to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
            --s3-key springboot-lambda-0.0.1-SNAPSHOT.jar || { echo "Lambda deployment failed!"; exit 1; }
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Verify Deployment & Check Lambda Version
        run: |
          aws lambda get-function-configuration --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} --query 'Version' --output text
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
