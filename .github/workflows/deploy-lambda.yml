name: Deploy Spring Boot Lambda to AWS 

on:
  push:
    branches:
      - main  # Change this if you use another branch
    paths:
     - 'springboot-backend-lampda/**'

  workflow_dispatch:  # Allows manual execution from GitHub Actions

  jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build the JAR
        run: |
          cd springboot-backend-lampda
          mvn clean package -DskipTests

      - name: Upload JAR to S3
        run: |
          aws s3 cp springboot-backend-lampda/target/springboot-lambda-0.0.1-SNAPSHOT.jar s3://lambdabackend-thiru/springboot-lambda.jar --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy JAR to Lambda
        run: | 
          aws lambda update-function-code --function-name EmployeeLambdaHandler --s3-bucket lambdabackend-thiru --s3-key springboot-lambda.jar --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify Deployment
        run: |
          aws lambda get-function-configuration --function-name EmployeeLambdaHandler --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}