name: Angular UI CI/CD

on:
  push:
    branches:
      - main  # Change this if your branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Angular CLI
        run: npm install -g @angular/cli@12.1.3

      - name: Install Dependencies
        run: npm ci
        working-directory: angular-frontend  # Adjust if needed

      - name: Build Angular App
        run: ng build --configuration=production
        working-directory: angular-frontend

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: angular-frontend/dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # North Virginia (your region)

      - name: Deploy to S3
        run: aws s3 sync angular-frontend/dist/angular-frontend s3://angular-ui-deployment-bucket --delete

      - name: Invalidate CloudFront Cache (Optional)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
