name: Deploy Angular UI

on:
  push:
    branches:
      - main
    paths:
      - "angular-frontend/**"

jobs:
  deploy-ui:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set Node.js Compatibility
      run: echo "NODE_OPTIONS=--openssl-legacy-provider" >> $GITHUB_ENV

    - name: Install Dependencies & Build
      run: |
        cd angular-frontend
        npm install
        npm run build --prod

    - name: Upload UI to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        aws s3 sync angular-frontend/dist s3://${{ secrets.S3_UI_BUCKET }}

    - name: SSH to EC2 and Deploy UI
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          sudo rm -rf /var/www/html/*
          aws s3 cp s3://${{ secrets.S3_UI_BUCKET }}/ /var/www/html/ --recursive
          sudo systemctl restart nginx