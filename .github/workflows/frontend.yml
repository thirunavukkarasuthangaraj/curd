name: Deploy UI to S3

on:
  push:
    branches:
      - main
    paths:
      - 'angular-frontend/**'  # Trigger only if UI files change
  workflow_dispatch:  # Allows manual execution

jobs:
  deploy-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Enable Debug Mode
        run: echo "Running with debug mode enabled"
        
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Debug directory structure
        run: ls -l

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16  # Adjust version if needed

      - name: Debug NPM and Node Versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: |
          cd angular-frontend
          npm install

      - name: Build Angular App
        run: |
          cd angular-frontend
          npm run build --prod

      - name: Verify Build Output
        run: ls -l angular-frontend/dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1  # Change to your AWS region

      - name: Upload to S3
        run: |
          aws s3 sync angular-frontend/dist/angular-frontend s3://ui-thiru --delete

      - name: Verify S3 Upload
        run: aws s3 ls s3://ui-thiru --recursive
