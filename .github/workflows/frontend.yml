name: Deploy Angular App to AWS ECR

on:
  push:
    branches:
      - main  # Change to your branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Make sure your region is correct

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1
      with:
        region: us-east-1  # Ensure the region is specified

    - name: Build, tag, and push Docker image to Amazon ECR
      env:
        ECR_REGISTRY: 431003481885.dkr.ecr.us-east-1.amazonaws.com
        IMAGE_NAME: angular-frontend
      run: |
        docker build -t $IMAGE_NAME .
        docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$IMAGE_NAME:latest
        docker push $ECR_REGISTRY/$IMAGE_NAME:latest

    - name: Update ECS service to deploy new image
      run: |
        aws ecs update-service --cluster angular-cluster-thiru --service angular-service-thiru --force-new-deployment --region us-east-1