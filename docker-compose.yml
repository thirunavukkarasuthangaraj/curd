version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres-1
    restart: always
    ports:
      - "5433:5432"        # Expose 5432 inside container to 5433 outside
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: database-1

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper-1
    restart: always
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: kafka-1
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.5
    container_name: elasticsearch-1
    restart: always
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"

  backend:
    build: ./springboot-backend
    container_name: springboot-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - postgres
      - elasticsearch
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432/database-1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092

  frontend:
    build: ./angular-frontend
    container_name: angular-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

networks:
  default:
    driver: bridge
