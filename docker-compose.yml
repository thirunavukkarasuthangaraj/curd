# =============================
# FINAL docker-compose.yml
# =============================

version: '3.8'

services:

  backend:
    build:
      context: ./springboot-backend
    container_name: springboot-backend-1
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432/database-1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092
      SPRING_DATA_ELASTICSEARCH_URIS: http://elasticsearch-1:9200
    depends_on:
      postgres-1:
        condition: service_started
      kafka-1:
        condition: service_started
      elasticsearch-1:
        condition: service_healthy


  frontend:
    build:
      context: ./angular-frontend
    container_name: angular-frontend-1
    ports:
      - "4200:80"
    depends_on:
      - backend


  postgres-1:
    image: postgres:15
    container_name: postgres-1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: database-1

  zookeeper-1:
    image: wurstmeister/zookeeper
    container_name: zookeeper-1
    ports:
      - "2181:2181"

  kafka-1:
    image: wurstmeister/kafka
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka-1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181

  elasticsearch-1:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.5
    container_name: elasticsearch-1
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10


networks:
  default:
    driver: bridge
